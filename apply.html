<!--Job Application Page-->

<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="utf-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Apply for positions in the Digital Learning and Research Unit (DLRU) at the university.">
        <meta name="keywords" content="university jobs, digital learning, research, job application">
        <meta name="author" content="Jingyee">
        
        <title>Job Application</title>
        
        <link href="styles.css" rel="stylesheet">
    </head>

    <body>
        <header>
            <h1>Job Application Page</h1>
            <a href="#application-form">Apply Now</a>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="jobs.html">Jobs</a></li>
                    <li><a href="apply.html">Apply</a></li>
                    <li><a href="about.html">About Us</a></li>
                </ul>
            </nav>
        </header>

        <hr>
        
        <main>
            <form id="application-form" method="post" action="https://mercury.swin.edu.au/it000000/formtest.php">
                <h2>Application Form</h2>

                <label for="jobref">Job Reference Number:</label>
                <input type="text" id="jobref" name="jobref"
                    pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{5}$"
                    title="Format: exactly 5 alphanumeric characters"
                    required>

                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="fname">First Name:</label>
                        <input type="text" id="fname" name="fname"
                            pattern="[A-Za-z ]{1,20}" maxlength="20"
                            title="Format: max 20 alpha characters"
                        required>
                    
                    <label for="lname">Last Name:</label>
                    <input type="text" id="lname" name="lname"
                        pattern="[A-Za-z ]{1,20}" maxlength="20"
                        title="Format: max 20 alpha characters"
                        required>
                    
                    <label for="dob">Date of Birth:</label>
                    <input type="text" id="dob" name="dob"
                        placeholder="dd/mm/yyyy"
                        pattern="(0[1-9]|[12]\d|3[01])/(0[1-9]|1[0-2])/\d{4}"
                        title="Format: dd/mm/yyyy"
                        required>
                </fieldset>

                <fieldset>
                    <legend>Gender</legend>

                    <input type="radio" id="male" name="gender" value="M" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="F">
                    <label for="female">Female</label>
                </fieldset>
                
                <fieldset>
                    <legend>Address</legend>

                    <label for="street">Street Address</label>
                    <input type="text" id="street" name="street"
                        maxlength="40"
                        title="Format: max 40 characters"
                        required>

                    <label for="suburb">Suburb/Town</label>
                    <input type="text" id="suburb" name="suburb"
                        maxlength="40"
                        title="Format: max 40 characters"
                        required>

                    <label for="state">State</label>
                    <select id="state" name="state"
                        title="Select State"
                        required>
                        <option value="">-- Please Select --</option>
                        <option value="VIC">VIC</option>
                        <option value="NSW">NSW</option>
                        <option value="QLD">QLD</option>
                        <option value="NT">NT</option>
                        <option value="WA">WA</option>
                        <option value="SA">SA</option>
                        <option value="TAS">TAS</option>
                        <option value="ACT">ACT</option>
                    </select>

                    <label for="postcode">Postcode</label>
                    <input type="text" id="postcode" name="postcode"
                        pattern="\d{4}"
                        title="Format: exactly 4 digits"
                        required>
                </fieldset>

                <fieldset>
                    <legend>Contact</legend>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                        title="Format: valid email"
                        required>

                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                        pattern="\d{8,12}"
                        title="Format: 8-12 digits"
                        required>
                </fieldset>

                <fieldset>
                    <legend>Skills</legend>

                    <input type="checkbox" id="python" name="skill[]" value="python">
                    <label for="python">Python</label>

                    <input type="checkbox" id="html" name="skill[]" value="html">
                    <label for="html">HTML</label>  

                    <input type="checkbox" id="javascript" name="skill[]" value="javascript">
                    <label for="javascript">JavaScript</label>

                    <input type="checkbox" id="sql" name="skill[]" value="mysql">
                    <label for="sql">MySQL</label>

                    <input type="checkbox" id="other" name="skill[]" value="other">
                    <label for="other">Other skills...</label>

                    <label for="others">Other Skills:</label>
                    <textarea id="others" name="others"
                        placeholder="Write your other skills here..."
                        rows="5" cols="50"></textarea>
                </fieldset>

                <hr>

                <button type="submit">Apply</button>
                <button type="reset">Reset Form</button>
            </form>
        </main>
    </body>
</html>
